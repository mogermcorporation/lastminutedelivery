<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Minute Delivery - Las Vegas Express Courier Dispatch</title>
  
  <!-- PayPal SDK (Replace YOUR_PAYPAL_CLIENT_ID with your actual Client ID) -->
  <script src="https://www.paypal.com/sdk/js?client-id=BAAx0xZ88mT_O1YcpXVYErt0zdGYeqHiDt4YszrI4e5N34sTxa5FJvYOYo2w0pLDb6YIOC2YQIZF3Oyp14&enable-funding=venmo&disable-funding=paylater&currency=USD"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0e15;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #151621;
      border: 1px solid #232538;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      padding: 30px 20px;
      text-align: center;
    }

    .logo-container {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo-container img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .form-body {
      padding: 24px;
    }

    .fee-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1f30;
      border: 1px solid #2d2f48;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .fee-label-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    .fee-label-sub {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      margin-top: 2px;
    }

    .fee-amount {
      font-size: 1.25rem;
      font-weight: 700;
      color: #10b981;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: #1a1b2a;
      border: 1px solid #2c2d45;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #3b82f6;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .checkout-title {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin: 24px 0 14px;
      text-transform: uppercase;
    }

    #paypal-button-container {
      margin-top: 10px;
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- HEADER -->
    <div class="header">
      <div class="logo-container">
        <!-- SVG Icon fallback if logo image path isn't present -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
      </div>
      <h1>Last Minute Delivery</h1>
      <p>Las Vegas Express Courier Dispatch</p>
    </div>

    <!-- FORM BODY -->
    <div class="form-body">
      
      <!-- PACKAGE SIZE SELECTOR -->
      <div class="form-group">
        <label for="package-size">Package Size</label>
        <select id="package-size" onchange="updateCalculatedFee()">
          <option value="15.95">Small Package (Envelope / Small Box) - $15.95</option>
          <option value="25.95">Medium Package (Medium Box / Multi-item) - $25.95</option>
          <option value="35.95">Large Package (Heavy / Oversized) - $35.95</option>
        </select>
      </div>

      <!-- SERVICE FEE DISPLAY CARD -->
      <div class="fee-card">
        <div>
          <div class="fee-label-title"><span class="dot"></span> SERVICE FEE</div>
          <div class="fee-label-sub" id="fee-description-label">Express Local Delivery (3 mi included)</div>
        </div>
        <div class="fee-amount" id="calculated-fee-display">$15.95</div>
      </div>

      <!-- HIDDEN INPUT FOR PAYPAL CALCULATED AMOUNT -->
      <input type="hidden" id="paypal-amount-input" value="15.95" />

      <!-- CONTACT & ADDRESS FIELDS -->
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" placeholder="e.g. Jane Doe" required />
      </div>

      <div class="form-group">
        <label for="phone-number">Phone Number</label>
        <input type="tel" id="phone-number" placeholder="e.g. (702) 555-0199" required />
      </div>

      <div class="form-group">
        <label for="pickup-address">Pickup Address</label>
        <input type="text" id="pickup-address" placeholder="e.g. 3570 S Las Vegas Blvd, Las Vegas, NV 89109" required />
      </div>

      <div class="form-group">
        <label for="dropoff-address">Drop-Off Address</label>
        <input type="text" id="dropoff-address" placeholder="e.g. 123 Main St, Las Vegas, NV 89101" required />
      </div>

      <div class="form-group">
        <label for="delivery-time">Requested Delivery Time</label>
        <input type="datetime-local" id="delivery-time" required />
      </div>

      <!-- DELIVERY NOTES SECTION -->
      <div class="form-group">
        <label for="delivery-notes">Special Instructions / Notes (Optional)</label>
        <textarea id="delivery-notes" placeholder="e.g. Gate code #1234, leave package with front desk, call upon arrival..."></textarea>
      </div>

      <!-- CHECKOUT CONTAINER -->
      <div class="checkout-title">Complete Payment & Dispatch Driver</div>
      
      <!-- PAYPAL & VENMO BUTTON CONTAINER -->
      <div id="paypal-button-container"></div>

      <div class="footer-note">
        🔒 Encrypted Checkout • On-Demand Local Delivery
      </div>

    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    // PRICING CONFIGURATION
    const BASE_MILES = 3.0;
    const EXTRA_PER_MILE_RATE = 1.25;
    let estimatedDistanceMiles = 3.0; // Default base distance

    function calculateTotalFee(basePrice, totalMiles) {
      let finalPrice = basePrice;
      if (totalMiles > BASE_MILES) {
        const extraMiles = totalMiles - BASE_MILES;
        finalPrice += extraMiles * EXTRA_PER_MILE_RATE;
      }
      return finalPrice.toFixed(2);
    }

    function updateCalculatedFee() {
      const basePrice = parseFloat(document.getElementById('package-size').value);
      const totalAmount = calculateTotalFee(basePrice, estimatedDistanceMiles);
      
      document.getElementById('calculated-fee-display').innerText = `$${totalAmount}`;
      document.getElementById('paypal-amount-input').value = totalAmount;
    }

    // PAYPAL SDK BUTTON INITIALIZATION
    paypal.Buttons({
      style: {
        layout: 'vertical',
        color:  'gold',     // Gold container fixes text contrast for PayPal & Venmo
        shape:  'rect',
        label:  'paypal'
      },

      createOrder: function(data, actions) {
        const currentTotal = document.getElementById('paypal-amount-input').value || "15.95";
        const fullName = document.getElementById('full-name').value || "Customer";
        const notes = document.getElementById('delivery-notes').value || "No special instructions";

        return actions.order.create({
          purchase_units: [{
            amount: {
              currency_code: 'USD',
              value: currentTotal
            },
            description: `Last Minute Delivery for ${fullName}`,
            custom_id: notes.substring(0, 127) // Securely pass delivery instructions
          }]
        });
      },

      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Payment Successful! Dispatching courier for ' + details.payer.name.given_name);
        });
      },

      onError: function(err) {
        console.error('PayPal Checkout Error:', err);
        alert('Payment process encountered an issue. Please try again.');
      }
    }).render('#paypal-button-container');
  </script>
</body>
</html>
