<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Minute Delivery | Express Local Courier</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PayPal SDK: Venmo Enabled & Pay Later Disabled -->
  <script src="https://www.paypal.com/sdk/js?client-id=BAAx0xZ88mT_O1YcpXVYErt0zdGYeqHiDt4YszrI4e5N34sTxa5FJvYOYo2w0pLDb6YIOC2YQIZF3Oyp14&currency=USD&enable-funding=venmo&disable-funding=paylater"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700/60 rounded-2xl shadow-2xl overflow-hidden my-8">
    
    <!-- Header Banner with JPG Logo -->
    <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 p-6 text-center relative">
      <img src="logo.jpg" alt="Last Minute Delivery Logo" class="w-28 h-28 mx-auto rounded-2xl shadow-xl border-2 border-white/20 mb-3 object-cover">
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Last Minute Delivery</h1>
      <p class="text-blue-100 text-xs mt-1 font-medium">Las Vegas Express Courier Dispatch</p>
    </div>

    <!-- Order Fee Summary -->
    <div class="px-6 pt-5 pb-2">
      <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl p-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Service Fee</p>
            <p class="text-sm font-bold text-slate-200">Express Local Delivery</p>
          </div>
        </div>
        <span class="text-lg font-black text-emerald-400">$10.00</span>
      </div>
    </div>

    <!-- Delivery Form -->
    <div class="p-6 space-y-4">
      
      <div id="error-message" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold p-3 rounded-lg text-center">
        ⚠️ Please complete all fields before proceeding to payment.
      </div>

      <div>
        <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Full Name
        </label>
        <input 
          type="text" 
          id="fullName" 
          placeholder="e.g. Jane Doe" 
          class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 text-sm rounded-lg px-3.5 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-500"
          required
        />
      </div>

      <div>
        <label for="phoneNumber" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Phone Number
        </label>
        <input 
          type="tel" 
          id="phoneNumber" 
          placeholder="e.g. (702) 555-0199" 
          class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 text-sm rounded-lg px-3.5 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-500"
          required
        />
      </div>

      <div>
        <label for="pickupAddress" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Pickup Address
        </label>
        <input 
          type="text" 
          id="pickupAddress" 
          placeholder="e.g. 3570 S Las Vegas Blvd, Las Vegas, NV 89109" 
          class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 text-sm rounded-lg px-3.5 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-500"
          required
        />
      </div>

      <div>
        <label for="streetAddress" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Drop-Off Address
        </label>
        <input 
          type="text" 
          id="streetAddress" 
          placeholder="e.g. 123 Main St, Las Vegas, NV 89101" 
          class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 text-sm rounded-lg px-3.5 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-500"
          required
        />
      </div>

      <div>
        <label for="deliveryTime" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Requested Delivery Time
        </label>
        <input 
          type="datetime-local" 
          id="deliveryTime" 
          class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 text-sm rounded-lg px-3.5 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-slate-300"
          required
        />
      </div>

      <!-- Payment Buttons Container -->
      <div class="pt-2">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 text-center">
          Complete Payment & Dispatch Driver
        </label>
        <div id="paypal-button-container" class="min-h-[150px]"></div>
      </div>

    </div>

    <!-- Footer -->
    <div class="bg-slate-900/40 border-t border-slate-700/40 p-3 text-center">
      <p class="text-[11px] text-slate-500 font-medium">
        🔒 Encrypted Checkout • On-Demand Local Delivery
      </p>
    </div>

  </div>

  <script>
    paypal.Buttons({
      style: {
        layout: 'vertical',
        color: 'gold',
        shape: 'rect',
        label: 'pay'
      },
      onClick: function(data, actions) {
        var name = document.getElementById('fullName').value.trim();
        var phone = document.getElementById('phoneNumber').value.trim();
        var pickup = document.getElementById('pickupAddress').value.trim();
        var dropoff = document.getElementById('streetAddress').value.trim();
        var time = document.getElementById('deliveryTime').value.trim();

        if (!name || !phone || !pickup || !dropoff || !time) {
          document.getElementById('error-message').classList.remove('hidden');
          return actions.reject();
        } else {
          document.getElementById('error-message').classList.add('hidden');
          return actions.resolve();
        }
      },
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: '10.00'
            }
          }]
        });
      },
      onApprove: function(data, actions) {
        var customerData = {
          orderID: data.orderID,
          customerName: document.getElementById('fullName').value.trim(),
          customerPhone: document.getElementById('phoneNumber').value.trim(),
          pickupAddress: document.getElementById('pickupAddress').value.trim(),
          customerAddress: document.getElementById('streetAddress').value.trim(),
          deliveryTime: document.getElementById('deliveryTime').value.trim()
        };

        return fetch('https://lastminutedelivery.vercel.app/api/capture-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(customerData)
        })
        .then(function(response) {
          return response.json();
        })
        .then(function(details) {
          if (details.status === 'COMPLETED' || details.success) {
            alert('Payment successful! Delivery dispatched via Shipday.');
            console.log('Order Details:', details);
          } else {
            alert('Payment capture failed. Check console for details.');
            console.error('Capture Error:', details);
          }
        })
        .catch(function(error) {
          console.error('Network Error:', error);
          alert('An error occurred while completing your payment.');
        });
      }
    }).render('#paypal-button-container');
  </script>

</body>
</html>
