<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Minute Delivery Checkout</title>
  <!-- Replace YOUR_LIVE_PAYPAL_CLIENT_ID with your Live Client ID -->
  <script src="https://www.paypal.com/sdk/js?client-id=BAAx0xZ88mT_O1YcpXVYErt0zdGYeqHiDt4YszrI4e5N34sTxa5FJvYOYo2w0pLDb6YIOC2YQIZF3Oyp14&currency=USD"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 20px;
    }
    .checkout-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    #error-message {
      color: #d9534f;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <h1>Last Minute Delivery</h1>
    
    <div id="error-message">Please fill in all delivery details before paying.</div>

    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Jane Doe" required>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Phone Number</label>
      <input type="tel" id="phoneNumber" placeholder="7025550199" required>
    </div>

    <div class="form-group">
      <label for="streetAddress">Delivery Address</label>
      <input type="text" id="streetAddress" placeholder="123 Main St, Las Vegas, NV 89101" required>
    </div>

    <div id="paypal-button-container"></div>
  </div>

  <script>
    paypal.Buttons({
      onClick: function(data, actions) {
        var name = document.getElementById('fullName').value.trim();
        var phone = document.getElementById('phoneNumber').value.trim();
        var address = document.getElementById('streetAddress').value.trim();

        if (!name || !phone || !address) {
          document.getElementById('error-message').style.display = 'block';
          return actions.reject();
        } else {
          document.getElementById('error-message').style.display = 'none';
          return actions.resolve();
        }
      },
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: '10.00'
            }
          }]
        });
      },
      onApprove: function(data, actions) {
        var customerData = {
          orderID: data.orderID,
          customerName: document.getElementById('fullName').value.trim(),
          customerPhone: document.getElementById('phoneNumber').value.trim(),
          customerAddress: document.getElementById('streetAddress').value.trim()
        };

        return fetch('https://lastminutedelivery.vercel.app/api/capture-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(customerData)
        })
        .then(function(response) {
          return response.json();
        })
        .then(function(details) {
          if (details.status === 'COMPLETED' || details.success) {
            alert('Payment successful! Delivery dispatched via Shipday.');
            console.log('Order Details:', details);
          } else {
            alert('Payment capture failed. Check console for details.');
            console.error('Capture Error:', details);
          }
        })
        .catch(function(error) {
          console.error('Network Error:', error);
          alert('An error occurred while completing your payment.');
        });
      }
    }).render('#paypal-button-container');
  </script>

</body>
</html>
